[config]
version_check = false

[templates.colors]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/matugen/colors.css'

[templates.waybar]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/matugen.css'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.swaync]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/swaync/matugen.css'
post_hook = 'swaync-client -rs'

[templates.swayosd]
input_path = '~/.config/matugen/templates/swayosd.css'
output_path = '~/.config/swayosd/matugen.css'
post_hook = 'killall -SIGUSR2 swayosd-server'
