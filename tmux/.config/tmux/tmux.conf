# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Set prefix
unbind-key C-b
set-option -g prefix M-p
bind-key M-p send-prefix

# Start windows & panes idx at 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows
set-option -g renumber-windows on

# Pane switching with nvim keybinds
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Position status bar on top
set-option -g status-position top

# Capture pane into nvim buffer
bind-key v run-shell "~/.config/tmux/scripts/tmux-capture-nvim.sh"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'TanglingTreats/tmux-everforest'
set -g @tmux-everforest 'dark-medium'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
